<svg width="100%" height="40" viewBox="0 0 1000 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { stroke: #e62429; stroke-width: 2; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: shoot 2.2s ease-out forwards; }
      @keyframes shoot { to { stroke-dashoffset: 0; } }
    </style>
    <path id="webpath" d="M0,20 Q250,0 500,20 T1000,20"/>
  </defs>
  <use href="#webpath" class="line"/>
  <circle r="4" fill="#ff5c5c">
    <animateMotion dur="2.2s" repeatCount="1" fill="freeze">
      <mpath href="#webpath"/>
    </animateMotion>
  </circle>
</svg>
