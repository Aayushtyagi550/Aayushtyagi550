<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e62429"/>
      <stop offset="100%" stop-color="#1f4fd8"/>
    </linearGradient>
    <style>
      .bg3 { fill: #0b0b12; }
      .lbl { font-family: 'Trebuchet MS', Verdana, sans-serif; fill: #e8e8e8; font-size: 15px; }
      .val { font-family: 'Trebuchet MS', Verdana, sans-serif; fill: #9fb4ff; font-size: 13px; }
      .track { fill: #1c1c26; rx: 6; }
      .bar { fill: url(#barGrad); rx: 6; transform: scaleX(0); transform-box: fill-box; transform-origin: left; }
      .b1 { animation: grow 1.4s ease-out .2s forwards; }
      .b2 { animation: grow 1.4s ease-out .5s forwards; }
      .b3 { animation: grow 1.4s ease-out .8s forwards; }
      .b4 { animation: grow 1.4s ease-out 1.1s forwards; }
      .b5 { animation: grow 1.4s ease-out 1.4s forwards; }
      @keyframes grow { to { transform: scaleX(1); } }

      .heading { font-family: 'Trebuchet MS', Verdana, sans-serif; fill: #ff5c5c; font-weight: 800; font-size: 20px; }
      .dot2 { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#bg3)" class="bg3"/>
  <circle class="dot2" cx="26" cy="30" r="5" fill="#e62429"/>
  <text x="42" y="36" class="heading">SPIDER-SENSE // SKILL WEB</text>

  <!-- Skill 1 -->
  <text x="30" y="80" class="lbl">Full Stack Development (MERN + Java)</text>
  <rect class="track" x="30" y="90" width="900" height="14"/>
  <rect class="bar b1" x="30" y="90" width="900" height="14"/>
  <text x="945" y="102" class="val">92%</text>

  <!-- Skill 2 -->
  <text x="30" y="140" class="lbl">Data Structures &amp; Algorithms</text>
  <rect class="track" x="30" y="150" width="900" height="14"/>
  <rect class="bar b2" x="30" y="150" width="810" height="14"/>
  <text x="945" y="162" class="val">88%</text>

  <!-- Skill 3 -->
  <text x="30" y="200" class="lbl">Cloud Fundamentals (AWS · Azure)</text>
  <rect class="track" x="30" y="210" width="900" height="14"/>
  <rect class="bar b3" x="30" y="210" width="720" height="14"/>
  <text x="945" y="222" class="val">80%</text>

  <!-- Skill 4 -->
  <text x="30" y="260" class="lbl">Competitive Programming (400+ LeetCode · 3★ CodeChef)</text>
  <rect class="track" x="30" y="270" width="900" height="14"/>
  <rect class="bar b4" x="30" y="270" width="765" height="14"/>
  <text x="945" y="282" class="val">85%</text>
</svg>
