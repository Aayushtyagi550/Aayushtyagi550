<svg width="100%" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#160a0d"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62429"/>
      <stop offset="100%" stop-color="#1f4fd8"/>
    </linearGradient>
    <style>
      .panel { fill: #12121a; stroke: url(#cardBorder); stroke-width: 1.6; rx: 12; opacity: 0; transform: translateY(16px); }
      .p1 { animation: rise .8s ease-out .1s forwards; }
      .p2 { animation: rise .8s ease-out .35s forwards; }
      .p3 { animation: rise .8s ease-out .6s forwards; }
      .p4 { animation: rise .8s ease-out .85s forwards; }
      @keyframes rise { to { opacity: 1; transform: translateY(0px); } }

      .ttl { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: 800; fill: #ffffff; font-size: 19px; }
      .sub { font-family: 'Trebuchet MS', Verdana, sans-serif; fill: #b9c2d0; font-size: 12.5px; }
      .tag { font-family: 'Trebuchet MS', Verdana, sans-serif; fill: #ff9d9d; font-size: 11px; }

      .strand { stroke: #7a2a2a; stroke-width: 1; opacity: 0.5; stroke-dasharray: 6 5; }

      .icon { animation: pop 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pop { 0%,100% { transform: scale(1);} 50% { transform: scale(1.12);} }
    </style>
    <path id="crawlpath" d="M120,80 Q500,10 880,80 Q500,180 120,280 Q500,350 880,280" fill="none"/>
  </defs>

  <rect width="1000" height="380" fill="url(#bg2)"/>

  <!-- connecting web strands between cards -->
  <line class="strand" x1="270" y1="90" x2="500" y2="90"/>
  <line class="strand" x1="500" y1="90" x2="730" y2="90"/>
  <line class="strand" x1="270" y1="270" x2="500" y2="270"/>
  <line class="strand" x1="130" y1="140" x2="130" y2="220"/>
  <line class="strand" x1="500" y1="140" x2="500" y2="220"/>
  <line class="strand" x1="870" y1="140" x2="870" y2="220"/>

  <!-- crawling spider that loops the whole board -->
  <g>
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#0d0d0d" stroke="#e62429" stroke-width="1.3"/>
    <circle cx="0" cy="-9" r="5" fill="#0d0d0d" stroke="#e62429" stroke-width="1.3"/>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#crawlpath"/>
    </animateMotion>
  </g>

  <!-- Card 1: SymptoGenie -->
  <rect class="panel p1" x="30" y="40" width="440" height="100" rx="12"/>
  <text x="52" y="72" class="ttl">🩺 SymptoGenie</text>
  <text x="52" y="94" class="sub">AI-powered healthcare assistant that analyzes symptoms</text>
  <text x="52" y="116" class="tag">MERN · AI / NLP</text>

  <!-- Card 2: MelodyVerse -->
  <rect class="panel p2" x="530" y="40" width="440" height="100" rx="12"/>
  <text x="552" y="72" class="ttl">🎵 MelodyVerse</text>
  <text x="552" y="94" class="sub">AI-driven music streaming platform</text>
  <text x="552" y="116" class="tag">MERN</text>

  <!-- Card 3: TaskFlow -->
  <rect class="panel p3" x="30" y="230" width="440" height="100" rx="12"/>
  <text x="52" y="262" class="ttl">✅ TaskFlow</text>
  <text x="52" y="284" class="sub">Full-stack task management application</text>
  <text x="52" y="306" class="tag">MERN</text>

  <!-- Card 4: Trident Guard -->
  <rect class="panel p4" x="530" y="230" width="440" height="100" rx="12"/>
  <text x="552" y="262" class="ttl">🛡️ Trident Guard</text>
  <text x="552" y="284" class="sub">Zero-trust auth platform — Top 10, Tally CodeBrewers 2026</text>
  <text x="552" y="306" class="tag">Full Stack Security</text>
</svg>
