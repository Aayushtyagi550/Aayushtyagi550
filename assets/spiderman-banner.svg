<svg width="100%" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="55%" stop-color="#170a0a"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="redBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e62429"/>
      <stop offset="50%" stop-color="#ff5c5c"/>
      <stop offset="100%" stop-color="#1f4fd8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .strand { stroke: #d43b3b; stroke-width: 1.4; fill: none; opacity: 0.55; stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.5s ease-out forwards; }
      .strand2 { animation-delay: .4s; }
      .strand3 { animation-delay: .8s; }
      .strand4 { animation-delay: 1.2s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .spider { animation: swing 3.4s ease-in-out infinite; transform-origin: 860px 0px; }
      @keyframes swing {
        0%   { transform: rotate(18deg) translateY(0px); }
        50%  { transform: rotate(-16deg) translateY(6px); }
        100% { transform: rotate(18deg) translateY(0px); }
      }
      .leg { animation: wiggle 0.9s ease-in-out infinite; transform-origin: center; }
      @keyframes wiggle { 0%,100% { transform: rotate(0deg);} 50% { transform: rotate(6deg);} }

      .thread { stroke: #cfcfcf; stroke-width: 1.5; opacity: 0.8; }

      .title { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: 800; fill: url(#redBlue); filter: url(#glow); opacity: 0; animation: fadeUp 1s ease-out 0.6s forwards; }
      .subtitle { font-family: 'Trebuchet MS', Verdana, sans-serif; fill: #e8e8e8; opacity: 0; animation: fadeUp 1s ease-out 1.3s forwards; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: translateY(0px);} }

      .pulseDot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { r: 3; opacity: .9;} 50% { r: 6; opacity: .3;} }
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#bgGrad)"/>

  <!-- background web strands -->
  <path class="strand" d="M0,0 L300,260" />
  <path class="strand strand2" d="M0,0 L520,260" />
  <path class="strand strand3" d="M1000,0 L700,260" />
  <path class="strand strand4" d="M1000,0 L470,260" />
  <path class="strand strand2" d="M0,260 Q500,120 1000,260" />

  <!-- radial web rings top-left corner -->
  <g opacity="0.45">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#d43b3b" stroke-width="1"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#d43b3b" stroke-width="1"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#d43b3b" stroke-width="1"/>
  </g>

  <!-- title -->
  <text x="60" y="120" class="title" font-size="52">AAYUSH TYAGI</text>
  <text x="62" y="160" class="subtitle" font-size="20">Your Friendly Neighborhood Full-Stack Developer</text>
  <text x="62" y="190" class="subtitle" font-size="15" fill="#9fb4ff">MERN • Java • DSA • Cloud (AWS/Azure)</text>

  <!-- pulsing web-shooter dot -->
  <circle class="pulseDot" cx="62" cy="200" r="3" fill="#ff4d4d"/>

  <!-- hanging thread + spider -->
  <line class="thread" x1="860" y1="0" x2="860" y2="60"/>
  <g class="spider">
    <g transform="translate(860,60)">
      <ellipse cx="0" cy="14" rx="11" ry="14" fill="#0d0d0d" stroke="#e62429" stroke-width="1.5"/>
      <circle cx="0" cy="-2" r="7" fill="#0d0d0d" stroke="#e62429" stroke-width="1.5"/>
      <line class="leg" x1="-9" y1="-4" x2="-22" y2="-14" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="9" y1="-4" x2="22" y2="-14" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="-10" y1="4" x2="-24" y2="4" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="10" y1="4" x2="24" y2="4" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="-9" y1="14" x2="-22" y2="24" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="9" y1="14" x2="22" y2="24" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="-6" y1="22" x2="-14" y2="34" stroke="#111" stroke-width="2"/>
      <line class="leg" x1="6" y1="22" x2="14" y2="34" stroke="#111" stroke-width="2"/>
      <path d="M-5,-4 Q0,-1 5,-4" stroke="#fff" stroke-width="1.5" fill="none"/>
    </g>
  </g>
</svg>
